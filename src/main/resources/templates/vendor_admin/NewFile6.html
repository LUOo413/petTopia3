<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店家評價管理</title>
<link rel="icon" type="image/png" sizes="16x16"
	th:href="@{/admin_static/images/favicon.png}">
<link th:href="@{/admin_static/css/style.css}" rel="stylesheet">
<link rel="stylesheet"
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.container {
	max-width: 80%;
	margin: auto;
	text-align: center;
}

.chart-container {
	width: 100%;
	height: 400px;
	display: flex;
	justify-content: center;
	align-items: center;
}

.tablecenter {
	margin-top: 30px;
	display: flex;
	justify-content: center;
}

.table-container {
	margin-top: 30px;
}

.table th, .table td {
	text-align: center;
}

.pagination {
	justify-content: center;
}
</style>
</head>

<body>
	<div id="main-wrapper">
		<div th:replace="~{layout/vendor_admin_header}"></div>
		<div class="content-body">
			<div class="container">
				<h2>店家評價概覽</h2>
				<h4>
					總平均評分: <span id="overallRating">-</span>
				</h4>

				<div class="chart-container">
					<canvas id="ratingChart"></canvas>
				</div>

				<div class="table-container">
					<h4>評價列表</h4>
					<input type="text" id="searchInput" class="form-control mb-3"
						placeholder="搜尋評價內容..." oninput="searchReviews()">
					<div class="tablecenter">
						<table class="table table-striped">
							<thead>
								<tr>
									<th>評論者</th>
									<th>評價時間</th>
									<th>環境評分</th>
									<th>價格評分</th>
									<th>服務評分</th>
									<th>評價內容</th>
									<th>操作</th>
								</tr>
							</thead>
							<tbody id="reviewsTable"></tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
        let ratingsData = {
            reviews: [
                { name: "小明", date: "2025-03-01", environment: 4.5, price: 4.0, service: 4.7, content: "店鋪整體很棒，服務也很好。" },
                { name: "小美", date: "2025-02-28", environment: 4.0, price: 4.3, service: 4.0, content: "價格實惠，服務態度親切。" }
            ]
        };

        function calculateOverallRating() {
            let total = 0, count = 0;
            ratingsData.reviews.forEach(r => {
                total += (r.environment + r.price + r.service) / 3;
                count++;
            });
            let overallRating = count ? (total / count).toFixed(2) : "-";
            document.getElementById('overallRating').innerText = overallRating;
            return parseFloat(overallRating);
        }
//         document.addEventListener('DOMContentLoaded', function () {
            function updateChart() {
                const avgEnv = ratingsData.reviews.reduce((sum, r) => sum + r.environment, 0) / ratingsData.reviews.length;
                const avgPrice = ratingsData.reviews.reduce((sum, r) => sum + r.price, 0) / ratingsData.reviews.length;
                const avgService = ratingsData.reviews.reduce((sum, r) => sum + r.service, 0) / ratingsData.reviews.length;
                const avgOverall = calculateOverallRating();

                new Chart(document.getElementById('ratingChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ['環境', '價格', '服務', '總平均評分'],
                        datasets: [{
                            label: '平均評分',
                            data: [avgEnv, avgPrice, avgService, avgOverall],
                            backgroundColor: ['rgba(54, 162, 235, 0.5)', 'rgba(255, 159, 64, 0.5)', 'rgba(75, 192, 192, 0.5)', 'rgba(153, 102, 255, 0.5)'],
                            borderWidth: 1
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true, max: 5 } } }
                });
            }
//         });

        function updateReviews() {
            const tableBody = document.getElementById('reviewsTable');
            tableBody.innerHTML = '';
            ratingsData.reviews.forEach((review, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${review.name}</td>
                    <td>${review.date}</td>
                    <td>${review.environment}</td>
                    <td>${review.price}</td>
                    <td>${review.service}</td>
                    <td>${review.content}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteReview(${index})">刪除</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function deleteReview(index) {
            ratingsData.reviews.splice(index, 1);
            updateReviews();
            updateChart();
            calculateOverallRating();
        }

        function searchReviews() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredReviews = ratingsData.reviews.filter(r => r.content.toLowerCase().includes(searchTerm));
            const tableBody = document.getElementById('reviewsTable');
            tableBody.innerHTML = '';
            filteredReviews.forEach((review, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${review.name}</td>
                    <td>${review.date}</td>
                    <td>${review.environment}</td>
                    <td>${review.price}</td>
                    <td>${review.service}</td>
                    <td>${review.content}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteReview(${index})">刪除</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            calculateOverallRating();
            updateChart();
            updateReviews();
        });
    </script>

</body>

</html>
