<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店家評價管理</title>
<link rel="stylesheet"
	th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
.table-hover tbody tr:hover {
	background-color: #f8f9fa;
	cursor: pointer;
}

.review-detail {
	display: none;
	background: #fdfdfd;
	border-left: 5px solid #007bff;
	padding: 10px;
	margin-top: 5px;
	box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
}
</style>
</head>

<body>
	<div class="container mt-4">
		<h2 class="mb-3">店家評價概覽</h2>
		<h4>
			總平均評分: <span id="overallRating" class="text-primary fw-bold">-</span>
		</h4>

		<!-- 評分圖表 -->
		<div class="chart-container mb-4">
			<canvas id="ratingChart"></canvas>
		</div>

		<!-- 搜尋欄 -->
		<div class="mb-3">
			<input type="text" id="searchInput" class="form-control"
				placeholder="搜尋評價內容..." oninput="searchReviews()">
		</div>

		<!-- 評價表格 -->
		<div class="table-responsive">
			<table class="table table-bordered table-hover shadow-sm rounded">
				<thead class="table-dark text-light">
					<tr>
						<th>評論者</th>
						<th>評價時間</th>
						<th>環境評分</th>
						<th>價格評分</th>
						<th>服務評分</th>
						<th>評價內容</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody id="reviewsTable" class="align-middle text-center"></tbody>
			</table>
		</div>
	</div>

	<script>
        let ratingsData = {
            reviews: [
                { name: "小明", date: "2025-03-01", environment: 4.5, price: 4.0, service: 4.7, content: "店鋪整體很棒，服務也很好。", expanded: false },
                { name: "小美", date: "2025-02-28", environment: 4.0, price: 4.3, service: 4.0, content: "價格實惠，服務態度親切。", expanded: false }
            ]
        };

        function calculateOverallRating() {
            let total = 0, count = ratingsData.reviews.length;
            ratingsData.reviews.forEach(r => total += (r.environment + r.price + r.service) / 3);
            let overallRating = count ? (total / count).toFixed(2) : "-";
            document.getElementById('overallRating').innerText = overallRating;
            return parseFloat(overallRating);
        }

        function updateChart() {
            const ctx = document.getElementById('ratingChart').getContext('2d');
            if (window.myChart) window.myChart.destroy(); // 防止重複繪製

            const avgEnv = ratingsData.reviews.reduce((sum, r) => sum + r.environment, 0) / ratingsData.reviews.length;
            const avgPrice = ratingsData.reviews.reduce((sum, r) => sum + r.price, 0) / ratingsData.reviews.length;
            const avgService = ratingsData.reviews.reduce((sum, r) => sum + r.service, 0) / ratingsData.reviews.length;
            const avgOverall = calculateOverallRating();

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['環境', '價格', '服務', '總平均評分'],
                    datasets: [{
                        label: '平均評分',
                        data: [avgEnv, avgPrice, avgService, avgOverall],
                        backgroundColor: ['rgba(54, 162, 235, 0.5)', 'rgba(255, 159, 64, 0.5)', 'rgba(75, 192, 192, 0.5)', 'rgba(153, 102, 255, 0.5)'],
                        borderWidth: 1
                    }]
                },
                options: { scales: { y: { beginAtZero: true, max: 5 } } }
            });
        }

        function updateReviews() {
            const tableBody = document.getElementById('reviewsTable');
            tableBody.innerHTML = '';
            ratingsData.reviews.forEach((review, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${review.name}</td>
                    <td>${review.date}</td>
                    <td>${review.environment}</td>
                    <td>${review.price}</td>
                    <td>${review.service}</td>
                    <td>${review.content}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteReview(${index})">刪除</button></td>
                `;
                row.onclick = () => toggleReviewDetails(index);
                tableBody.appendChild(row);

                // 插入詳細評論區塊
                const detailRow = document.createElement('tr');
                detailRow.innerHTML = `
                    <td colspan="7">
                        <div class="review-detail" id="detail-${index}">${review.content}</div>
                    </td>
                `;
                tableBody.appendChild(detailRow);
            });
        }

        function toggleReviewDetails(index) {
            let detailElement = document.getElementById(`detail-${index}`);
            detailElement.style.display = detailElement.style.display === "none" ? "block" : "none";
        }

        function deleteReview(index) {
            ratingsData.reviews.splice(index, 1);
            updateReviews();
            updateChart();
            calculateOverallRating();
        }

        function searchReviews() {
            let searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filteredReviews = ratingsData.reviews.filter(r => r.content.toLowerCase().includes(searchTerm));
            ratingsData.reviews = filteredReviews;
            updateReviews();
        }

        document.addEventListener('DOMContentLoaded', function () {
            calculateOverallRating();
            updateChart();
            updateReviews();
        });
    </script>
</body>

</html>
